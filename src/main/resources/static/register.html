<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 图书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-card" style="max-width:520px;">
        <h2>账号注册</h2>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <!-- 角色选择 -->
            <div class="mb-4">
                <label class="form-label">账号类型 <span class="text-danger">*</span></label>
                <div class="role-selector">
                    <div class="role-card selected" data-role="USER" onclick="selectRole('USER')">
                        <i class="bi bi-person"></i>
                        <div class="role-name">普通用户</div>
                        <div class="role-desc">买书 / 卖书 / 留言</div>
                    </div>
                    <div class="role-card" data-role="ADMIN" onclick="selectRole('ADMIN')">
                        <i class="bi bi-shield-lock"></i>
                        <div class="role-name">管理员</div>
                        <div class="role-desc">平台运营 / 用户管理</div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">确认密码 <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入密码" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">邮箱</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="选填">
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">手机号</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="text" class="form-control" id="phone" placeholder="选填">
                    </div>
                </div>
            </div>
            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-primary btn-lg">注 册</button>
            </div>
        </form>
        <div class="text-center mt-3" style="font-size:14px;">
            已有账号？<a href="login.html" class="text-decoration-none">去登录</a>
        </div>
    </div>

    <!-- 自定义提示弹窗 -->
    <div class="modal fade" id="msgModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-brand">
                <div class="modal-header">
                    <h5 class="modal-title" id="msgTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body" id="msgText"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">知道了</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var selectedRole = 'USER';

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(function (el) {
                el.classList.toggle('selected', el.dataset.role === role);
            });
        }

        function showMsg(text, title, needRedirect) {
            document.getElementById('msgText').textContent = text;
            if (title) document.getElementById('msgTitle').textContent = title;
            var myModal = new bootstrap.Modal(document.getElementById('msgModal'));
            myModal.show();
            if (needRedirect) {
                document.getElementById('msgModal').addEventListener('hidden.bs.modal', function () {
                    window.location.href = 'login.html';
                }, { once: true });
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!username || !password || !confirmPassword) {
                showMsg('请填写用户名、密码和确认密码', '提示');
                return false;
            }
            if (password !== confirmPassword) {
                showMsg('两次输入的密码不一致', '提示');
                return false;
            }

            fetch('/user/register?username=' + encodeURIComponent(username) +
                  '&password=' + encodeURIComponent(password) +
                  '&role=' + encodeURIComponent(selectedRole))
                .then(function (res) { return res.json(); })
                .then(function (res) {
                    if (res.code === 200) {
                        showMsg('注册成功，即将跳转登录', '成功', true);
                    } else if (res.code === 503) {
                        showMsg('该用户名已存在，请更换', '注册失败');
                    } else {
                        showMsg(res.message || '注册失败', '注册失败');
                    }
                })
                .catch(function () {
                    showMsg('网络异常，请稍后重试', '提示');
                });

            return false;
        }
    </script>
</body>
</html>
