<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .order-card {
            background: #fff;
            border: none;
            border-radius: .75rem;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 .125rem .25rem rgba(44,62,80,.06), 0 .5rem 1rem rgba(44,62,80,.08);
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .order-card:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1.5rem rgba(44,62,80,.15); }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .order-id { font-size: 13px; color: #999; }
        .order-time { font-size: 12px; color: #bbb; }
        .order-body { display: flex; justify-content: space-between; align-items: center; }
        .book-info { flex: 1; }
        .book-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .order-amount { font-size: 20px; font-weight: 700; color: #e74c3c; }
        .order-footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
        .tab-custom .nav-link {
            color: #666;
            font-weight: 500;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 12px 25px;
        }
        .tab-custom .nav-link.active {
            color: var(--brand-primary);
            border-bottom-color: var(--brand-primary);
            background: transparent;
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link active" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <!-- 选项卡 -->
            <ul class="nav tab-custom mb-4 bg-white rounded-top" id="orderTabs">
                <li class="nav-item">
                    <a class="nav-link active" href="javascript:void(0)" onclick="switchTab('buyer')">
                        <i class="bi bi-cart3"></i> 我的购买订单
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)" onclick="switchTab('seller')">
                        <i class="bi bi-shop"></i> 我的销售订单
                    </a>
                </li>
            </ul>

            <!-- 订单列表 -->
            <div id="orderList">
                <div class="text-center text-muted py-5">
                    <div class="spinner-border text-primary mb-2"></div>
                    <div>正在加载...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var currentTab = 'buyer';
    var userId = '';

    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        userId = sessionStorage.getItem('userId') || '1';
        $('#displayUsername').text(username);
        loadOrders('buyer');
    });

    function switchTab(tab) {
        currentTab = tab;
        $('#orderTabs .nav-link').removeClass('active');
        if (tab === 'buyer') {
            $('#orderTabs .nav-link:eq(0)').addClass('active');
        } else {
            $('#orderTabs .nav-link:eq(1)').addClass('active');
        }
        loadOrders(tab);
    }

    function loadOrders(type) {
        $('#orderList').html('<div class="text-center text-muted py-5"><div class="spinner-border text-primary mb-2"></div><div>正在加载...</div></div>');

        var params = {};
        if (type === 'buyer') {
            params.buyerId = userId;
        } else {
            params.sellerId = userId;
        }

        $.get('/order/list', params, function (res) {
            if (res.code === 200 && res.data && res.data.length > 0) {
                renderOrders(res.data, type);
            } else {
                $('#orderList').html('<div class="text-center text-muted py-5"><i class="bi bi-inbox" style="font-size:48px"></i><div class="mt-2">暂无订单</div></div>');
            }
        }).fail(function () {
            $('#orderList').html('<div class="text-center text-danger py-5">加载失败，请稍后重试</div>');
        });
    }

    function renderOrders(list, type) {
        var html = '';
        $.each(list, function (i, order) {
            var statusMap = {
                '待付款': { bg: 'bg-warning text-dark', icon: 'bi-clock' },
                '已付款': { bg: 'bg-info text-white', icon: 'bi-check-circle' },
                '已完成': { bg: 'bg-success', icon: 'bi-check-circle-fill' },
                '已取消': { bg: 'bg-secondary', icon: 'bi-x-circle' }
            };
            var s = statusMap[order.status] || { bg: 'bg-secondary', icon: 'bi-question-circle' };

            html += '<div class="order-card">';
            html += '<div class="order-header">';
            html += '<span class="order-id">订单号：' + order.orderId + '</span>';
            html += '<span class="order-time">' + formatTime(order.createTime) + '</span>';
            html += '</div>';
            html += '<div class="order-body">';
            html += '<div class="book-info">';
            html += '<div class="book-title">' + (order.bookTitle || '书籍') + '</div>';
            html += '<div class="text-muted" style="font-size:13px">' + (order.buyerName ? '买家：' + order.buyerName : '') + (order.sellerName ? '卖家：' + order.sellerName : '') + '</div>';
            html += '</div>';
            html += '<div class="order-amount">¥' + order.totalAmount + '</div>';
            html += '</div>';
            html += '<div class="order-footer">';
            html += '<span class="status-badge ' + s.bg + '"><i class="bi ' + s.icon + '"></i> ' + order.status + '</span>';
            html += '<div class="action-btns">';

            if (type === 'buyer') {
                if (order.status === '待付款') {
                    html += '<button class="btn btn-danger btn-sm me-2" onclick="payOrder(' + order.orderId + ')"><i class="bi bi-credit-card"></i> 付款</button>';
                    html += '<button class="btn btn-outline-secondary btn-sm" onclick="cancelOrder(' + order.orderId + ')"><i class="bi bi-x-lg"></i> 取消</button>';
                } else if (order.status === '已完成') {
                    html += '<a href="eval.html?orderId=' + order.orderId + '&sellerId=' + order.sellerId + '" class="btn btn-warning btn-sm"><i class="bi bi-star"></i> 评价</a>';
                }
            } else {
                if (order.status === '已付款') {
                    html += '<button class="btn btn-success btn-sm" onclick="confirmOrder(' + order.orderId + ')"><i class="bi bi-check2-circle"></i> 确认取书</button>';
                }
            }

            html += '</div></div></div>';
        });
        $('#orderList').html(html);
    }

    function payOrder(orderId) {
        confirmDialog('确认付款吗？').then(function (ok) {
            if (!ok) return;
            $.post('/order/pay', { orderId: orderId }, function (res) {
                if (res.code === 200) {
                    showToast('付款成功', '成功');
                    loadOrders('buyer');
                } else {
                    showToast(res.message || '付款失败', '提示');
                }
            }).fail(function () { showToast('操作失败，请稍后重试', '提示'); });
        });
    }

    function cancelOrder(orderId) {
        confirmDialog('确认取消该订单吗？').then(function (ok) {
            if (!ok) return;
            $.post('/order/cancel', { orderId: orderId }, function (res) {
                if (res.code === 200) {
                    showToast('已取消', '成功');
                    loadOrders('buyer');
                } else {
                    showToast(res.message || '取消失败', '提示');
                }
            }).fail(function () { showToast('操作失败，请稍后重试', '提示'); });
        });
    }

    function confirmOrder(orderId) {
        confirmDialog('确认买家已取书吗？').then(function (ok) {
            if (!ok) return;
            $.post('/order/confirm', { orderId: orderId, sellerId: userId }, function (res) {
                if (res.code === 200) {
                    showToast('已确认，交易完成', '成功');
                    loadOrders('seller');
                } else {
                    showToast(res.message || '确认失败', '提示');
                }
            }).fail(function () { showToast('操作失败，请稍后重试', '提示'); });
        });
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        var d = new Date(timeStr);
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        var h = String(d.getHours()).padStart(2, '0');
        var min = String(d.getMinutes()).padStart(2, '0');
        return y + '-' + m + '-' + day + ' ' + h + ':' + min;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
