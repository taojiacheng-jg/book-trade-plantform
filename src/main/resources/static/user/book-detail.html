<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍详情 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .detail-cover {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: .75rem;
            box-shadow: 0 .5rem 1.5rem rgba(44,62,80,.15);
            background: #eee;
        }
        .book-title { font-weight: 700; font-size: 22px; color: var(--brand-dark); }
        .book-price { color: #e74c3c; font-size: 30px; font-weight: 700; }
        .book-price small { font-size: 16px; color: #999; text-decoration: line-through; margin-left: 10px; }
        .info-row { padding: 10px 0; border-bottom: 1px dashed #e9eef2; }
        .status-badge { font-size: 13px; padding: 5px 14px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3"><i class="bi bi-person-circle"></i> <span id="displayUsername">用户</span></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link active" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <div class="col-md-10 main-content p-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="book-list.html">商品浏览</a></li>
                    <li class="breadcrumb-item active">书籍详情</li>
                </ol>
            </nav>

            <div class="card rounded shadow-sm p-4" id="detailBox">
                <div class="text-center text-muted py-5"><div class="spinner-border text-primary mb-2"></div><div>正在加载...</div></div>
            </div>
        </div>
    </div>
</div>

<script>
    var bookId = '';
    var buyerId = '';

    $(function () {
        buyerId = sessionStorage.getItem('userId') || '1';
        $('#displayUsername').text(sessionStorage.getItem('username') || '用户');
        bookId = new URLSearchParams(window.location.search).get('id');
        if (!bookId) {
            showToast('缺少书籍ID', '提示');
            window.location.href = 'book-list.html';
            return;
        }
        loadBook();
    });

    function loadBook() {
        $.get('/book/detail', { bookId: bookId }, function (res) {
            if (res.code === 200 && res.data) {
                renderBook(res.data);
            } else {
                $('#detailBox').html('<div class="text-center text-danger py-5">' + (res.message || '加载失败') + '</div>');
            }
        }).fail(function () {
            $('#detailBox').html('<div class="text-center text-danger py-5">加载失败，请稍后重试</div>');
        });
    }

    function renderBook(b) {
        var cover = b.coverImgPath || 'https://via.placeholder.com/500x320?text=暂无封面';
        var statusClass = b.status === '在售' ? 'bg-success' : (b.status === '已预定' ? 'bg-warning text-dark' : 'bg-secondary');

        var html = '<div class="row">' +
            '<div class="col-md-5 mb-4">' +
            '<img class="detail-cover" src="' + cover + '" alt="' + escapeHtml(b.title) + '">' +
            '</div>' +
            '<div class="col-md-7">' +
            '<span class="status-badge ' + statusClass + ' mb-2 d-inline-block">' + b.status + '</span>' +
            '<h3 class="book-title">' + escapeHtml(b.title) + '</h3>' +
            '<p class="book-price">¥' + b.sellingPrice + '<small>¥' + (b.originalPrice || '—') + '</small></p>' +
            '<div class="mt-3">' +
            '<div class="info-row"><span class="text-muted">课程</span><span class="ms-3">' + escapeHtml(b.courseName || '未关联课程') + '</span></div>' +
            '<div class="info-row"><span class="text-muted">ISBN</span><span class="ms-3">' + escapeHtml(b.isbn || '—') + '</span></div>' +
            '<div class="info-row"><span class="text-muted">成色</span><span class="ms-3">' + escapeHtml(b.conditionDesc || '未填写') + '</span></div>' +
            '<div class="info-row"><span class="text-muted">卖家</span><span class="ms-3">' + escapeHtml(b.sellerName || ('用户#' + b.sellerId)) + ' <span class="badge bg-info text-dark ms-2">信用 ' + (b.creditScore || '5.00') + ' ⭐</span></span></div>' +
            '<div class="info-row"><span class="text-muted">发布时间</span><span class="ms-3">' + formatTime(b.publishTime) + '</span></div>' +
            '</div>' +
            '<div class="d-flex gap-2 mt-4">' +
            '<button class="btn btn-primary btn-lg px-4" id="buyBtn" onclick="buyBook()"><i class="bi bi-cart-plus"></i> 立即购买</button>' +
            '<a href="book-list.html" class="btn btn-outline-secondary btn-lg">返回</a>' +
            '</div>' +
            '</div></div>';

        $('#detailBox').html(html);
        if (b.status !== '在售') {
            $('#buyBtn').prop('disabled', true).text('该商品不可购买');
        }
        if (b.sellerId == buyerId) {
            $('#buyBtn').prop('disabled', true).text('不能购买自己发布的商品');
        }
    }

    function buyBook() {
        confirmDialog('确定购买这本书吗？').then(function (ok) {
            if (!ok) return;
            $.post('/order/create', { buyerId: buyerId, bookId: bookId }, function (res) {
                if (res.code === 200) {
                    showToast('下单成功，请前往订单页付款', '成功');
                    window.location.href = 'orders.html';
                } else {
                    showToast(res.message || '下单失败', '提示');
                    loadBook();
                }
            }).fail(function () { showToast('下单失败，请稍后重试', '提示'); });
        });
    }

    function formatTime(t) {
        if (!t) return '';
        var d = new Date(t);
        var pad = function (n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
