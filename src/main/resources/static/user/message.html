<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的留言 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .contact-list { border-right: 1px solid #eee; height: 600px; overflow-y: auto; }
        .contact-item {
            display: flex; align-items: center; padding: 14px 16px; cursor: pointer;
            border-bottom: 1px solid #f5f5f5; transition: background 0.2s;
        }
        .contact-item:hover { background: #eefaf7; }
        .contact-item.active { background: #eefaf7; border-left: 3px solid var(--brand-primary); }
        .contact-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-primary));
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-weight: 600; margin-right: 12px; flex-shrink: 0;
        }
        .contact-name { font-weight: 600; font-size: 15px; color: #333; }
        .contact-preview { font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .contact-time { font-size: 11px; color: #ccc; margin-left: auto; }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: 700; background: #fafafa; display: flex; align-items: center; }
        .chat-body { height: 430px; overflow-y: auto; padding: 20px; background: #f9fafc; display: flex; flex-direction: column; }
        .chat-msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
        .chat-msg.in { background: #fff; align-self: flex-start; border: 1px solid #eee; }
        .chat-msg.out { background: var(--brand-primary); color: #fff; align-self: flex-end; }
        .chat-msg .time { font-size: 11px; color: #bbb; margin-top: 6px; display: block; }
        .chat-msg.out .time { color: rgba(255,255,255,0.8); }
        .chat-input { padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        .chat-input textarea { flex: 1; resize: none; }
        .empty-tip { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link active" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <div class="chat-wrap">
                <div class="row g-0">
                    <!-- 联系人列表 -->
                    <div class="col-md-4 col-lg-3 contact-list" id="contactList">
                        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
                            <strong><i class="bi bi-chat-dots"></i> 联系会话</strong>
                            <button class="btn btn-sm btn-outline-primary" onclick="loadContacts()" title="刷新">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <div class="text-center text-muted py-4">加载中...</div>
                    </div>

                    <!-- 对话区域 -->
                    <div class="col-md-8 col-lg-9">
                        <div class="chat-header" id="chatHeader">
                            <i class="bi bi-chat-quote me-2"></i>
                            <span>请选择联系人查看对话</span>
                        </div>
                        <div class="chat-body" id="chatBody">
                            <div class="empty-tip">
                                <i class="bi bi-chat-square-dots" style="font-size:48px"></i>
                                <div class="mt-2">从左侧选择一个联系人开始聊天</div>
                            </div>
                        </div>
                        <div class="chat-input">
                            <textarea id="msgContent" rows="1" placeholder="输入消息内容..."></textarea>
                            <button class="btn btn-primary px-4" onclick="sendMessage()" id="sendBtn">
                                <i class="bi bi-send"></i> 发送
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var userId = '';
    var currentOtherId = null;

    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        userId = sessionStorage.getItem('userId') || '1';
        $('#displayUsername').text(username);
        loadContacts();
    });

    function loadContacts() {
        $.get('/message/contacts', { userId: userId }, function (res) {
            if (res.code === 200 && res.data && res.data.length > 0) {
                renderContacts(res.data);
            } else {
                $('#contactList').find('.text-muted').html('暂无会话');
            }
        }).fail(function () {
            $('#contactList').find('.text-muted').html('加载失败，请稍后重试');
        });
    }

    function renderContacts(list) {
        var html = '';
        $.each(list, function (i, c) {
            var firstChar = (c.otherName || '?').charAt(0).toUpperCase();
            html += '<div class="contact-item" id="contact-' + c.otherUserId + '" onclick="openChat(' + c.otherUserId + ', \'' + escapeHtml(c.otherName) + '\')">' +
                '<div class="contact-avatar">' + firstChar + '</div>' +
                '<div style="min-width:0;">' +
                '<div class="contact-name">' + escapeHtml(c.otherName) + '</div>' +
                '<div class="contact-preview">' + escapeHtml(c.lastContent || '') + '</div>' +
                '</div>' +
                '<div class="contact-time">' + formatTime(c.lastTime) + '</div>' +
                '</div>';
        });
        $('#contactList').html('<div class="p-3 border-bottom d-flex justify-content-between align-items-center">' +
            '<strong><i class="bi bi-chat-dots"></i> 联系会话</strong>' +
            '<button class="btn btn-sm btn-outline-primary" onclick="loadContacts()" title="刷新"><i class="bi bi-arrow-clockwise"></i></button>' +
            '</div>' + html);
    }

    function openChat(otherId, otherName) {
        currentOtherId = otherId;
        $('.contact-item').removeClass('active');
        $('#contact-' + otherId).addClass('active');
        $('#chatHeader').find('span').text(otherName);

        $('#chatBody').html('<div class="text-center text-muted py-5"><div class="spinner-border text-primary mb-2"></div><div>正在加载...</div></div>');

        $.get('/message/conversation', { userId: userId, otherId: otherId }, function (res) {
            if (res.code === 200 && res.data) {
                renderConversation(res.data);
            }
        }).fail(function () {
            $('#chatBody').html('<div class="text-danger text-center py-5">加载失败</div>');
        });
    }

    function renderConversation(list) {
        var html = '';
        $.each(list, function (i, m) {
            var isOut = m.fromUserId == userId;
            html += '<div class="chat-msg ' + (isOut ? 'out' : 'in') + '">' +
                escapeHtml(m.content) +
                '<span class="time">' + formatTime(m.sendTime) + (isOut ? '' : ' · ' + (m.bookId ? '关联书籍#' + m.bookId : '')) + '</span>' +
                '</div>';
        });
        $('#chatBody').html(html);
        var body = document.getElementById('chatBody');
        body.scrollTop = body.scrollHeight;
    }

    function sendMessage() {
        var content = $('#msgContent').val().trim();
        if (!content) { showToast('请输入消息内容', '提示'); return; }
        if (!currentOtherId) { showToast('请先选择联系人', '提示'); return; }

        $.post('/message/send', {
            fromUserId: userId,
            toUserId: currentOtherId,
            content: content
        }, function (res) {
            if (res.code === 200) {
                $('#msgContent').val('');
                // 重新加载对话并刷新联系人（最后一条消息更新）
                loadContacts();
                if (currentOtherId) {
                    var name = $('#chatHeader').find('span').text();
                    openChat(currentOtherId, name);
                }
            } else {
                showToast(res.message || '发送失败', '提示');
            }
        }).fail(function () { showToast('发送失败，请稍后重试', '提示'); });
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        var d = new Date(timeStr);
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        if (d.toDateString() === now.toDateString()) {
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        return (d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
