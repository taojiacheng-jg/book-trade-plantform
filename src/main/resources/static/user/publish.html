<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布商品 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .publish-card {
            padding: 35px;
            max-width: 700px;
        }
        .publish-card h4 { font-weight: 700; margin-bottom: 25px; }
        .cover-preview {
            width: 200px;
            height: 140px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .cover-preview:hover { border-color: var(--brand-primary); }
        .cover-preview img { max-width: 100%; max-height: 100%; object-fit: cover; display: none; }
        .cover-preview .placeholder { color: #aaa; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link active" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <div class="publish-card card rounded shadow-sm">
                <h4><i class="bi bi-pencil-square text-primary"></i> 发布书籍</h4>
                <form id="publishForm" onsubmit="return handlePublish(event)">
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label class="form-label">书名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" placeholder="请输入书名" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">ISBN</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="isbn" placeholder="选填" onblur="fetchPriceRef()">
                                <button class="btn btn-outline-secondary" type="button" title="查询新书参考价" onclick="fetchPriceRef()"><i class="bi bi-magic"></i></button>
                            </div>
                            <small class="form-text text-muted">输入ISBN后可查询参考价</small>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">原价</label>
                            <input type="number" class="form-control" id="originalPrice" placeholder="选填" step="0.01" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">售价 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="sellingPrice" placeholder="请输入售价" step="0.01" min="0.01" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">关联课程 <span class="text-danger">*</span></label>
                            <select class="form-select" id="courseId" required>
                                <option value="">请选择课程</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">成色描述</label>
                        <textarea class="form-control" id="conditionDesc" rows="3" placeholder="如：八成新，有少量笔记"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">封面图片</label>
                        <div class="cover-preview" onclick="$('#coverFile').click()">
                            <img id="coverImg" alt="封面预览">
                            <div class="placeholder" id="coverPlaceholder"><i class="bi bi-image"></i><br>点击上传封面</div>
                        </div>
                        <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="previewCover(this)">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4" id="submitBtn">发布</button>
                        <a href="book-list.html" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        $('#displayUsername').text(username);
        loadCourses();
    });

    function loadCourses() {
        $.get('/course/list', function (res) {
            if (res.code === 200 && res.data) {                var html = '<option value="">请选择课程</option>';
                $.each(res.data, function (i, c) {
                    html += '<option value="' + c.courseId + '">' + c.courseName + '</option>';
                });
                $('#courseId').html(html);
            }
        }).fail(function () {
            var fallback = [
                { courseId: 1, courseName: '数据结构与算法' },
                { courseId: 2, courseName: '操作系统' },
                { courseId: 3, courseName: '计算机网络' },
                { courseId: 4, courseName: '数据库系统原理' },
                { courseId: 5, courseName: '软件工程' }
            ];
            var html = '<option value="">请选择课程</option>';
            $.each(fallback, function (i, c) {
                html += '<option value="' + c.courseId + '">' + c.courseName + '</option>';
            });
            $('#courseId').html(html);
        });
    }

    function previewCover(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                $('#coverImg').attr('src', e.target.result).show();
                $('#coverPlaceholder').hide();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function fetchPriceRef() {
        var isbn = $('#isbn').val().trim();
        if (!isbn) return;
        $.get('/book/priceRef', { isbn: isbn }, function (res) {
            if (res.code === 200 && res.data && res.data.referencePrice) {
                var ref = res.data.referencePrice;
                $('#originalPrice').val(ref);
                if (!$('#sellingPrice').val()) {
                    $('#sellingPrice').val(ref * 0.8 > 0 ? parseInt(ref * 0.8 * 100) / 100 : '');
                }
                showToast('已根据 ISBN 填入参考原价：¥' + ref, '提示');
            }
        });
    }

    function handlePublish(e) {
        e.preventDefault();

        var title = $('#title').val().trim();
        var sellingPrice = parseFloat($('#sellingPrice').val());
        var courseId = $('#courseId').val();

        if (!title) { showToast('请输入书名', '提示'); return false; }
        if (!sellingPrice || sellingPrice <= 0) { showToast('售价必须为正数', '提示'); return false; }
        if (!courseId) { showToast('请选择关联课程', '提示'); return false; }

        var userId = sessionStorage.getItem('userId') || '1';

        var formData = new FormData();
        formData.append('title', title);
        formData.append('isbn', $('#isbn').val().trim());
        formData.append('originalPrice', $('#originalPrice').val());
        formData.append('sellingPrice', sellingPrice);
        formData.append('courseId', courseId);
        formData.append('conditionDesc', $('#conditionDesc').val().trim());
        formData.append('sellerId', userId);

        var fileInput = document.getElementById('coverFile');
        if (fileInput.files.length > 0) {
            formData.append('coverImage', fileInput.files[0]);
        }

        $('#submitBtn').prop('disabled', true).text('发布中...');

        $.ajax({
            url: '/book/publish',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function (res) {
                if (res.code === 200) {
                    showToast('发布成功', '成功');
                    window.location.href = 'book-list.html';
                } else {
                    showToast(res.message || '发布失败', '提示');
                    $('#submitBtn').prop('disabled', false).text('发布');
                }
            },
            error: function () {
                showToast('网络异常，请稍后重试', '提示');
                $('#submitBtn').prop('disabled', false).text('发布');
            }
        });

        return false;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
