<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .book-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .book-card:hover { transform: translateY(-4px); }
        .book-card .card-body { padding: 20px; }
        .book-card .card-title { font-size: 16px; font-weight: 600; }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <!-- 欢迎卡片 -->
            <div class="hero-gradient p-4 mb-4">
                <h3>欢迎，<span id="welcomeName">用户</span>！</h3>
                <p>这是你的个人中心，你可以浏览书籍、发布商品、管理订单。</p>
            </div>

            <!-- 推荐书籍 -->
            <h5 class="mb-3"><i class="bi bi-stars text-warning"></i> 推荐书籍</h5>
            <div class="row" id="recommendList">
                <div class="col text-center text-muted py-5">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        var userId = sessionStorage.getItem('userId');
        $('#displayUsername').text(username);
        $('#welcomeName').text(username);

        if (userId) {
            loadRecommend(userId);
        }
    });

    function loadRecommend(userId) {
        $.get('/book/recommend', { userId: userId }, function (res) {
            if (res.code === 200 && res.data && res.data.length > 0) {
                var list = res.data.slice(0, 3);
                var html = '';
                $.each(list, function (i, book) {
                    html += '<div class="col-md-4 mb-3">' +
                        '<div class="card book-card h-100 card-hover" onclick="goDetail(' + book.bookId + ')">' +
                        '<div class="card-body">' +
                        '<h5 class="card-title">' + (book.title || '未知书名') + '</h5>' +
                        '<p class="card-text text-muted mb-2">' + (book.conditionDesc || '暂无描述') + '</p>' +
                        '<div class="d-flex justify-content-between align-items-center">' +
                        '<span class="price">¥' + (book.sellingPrice || '0.00') + '</span>' +
                        '<span class="btn btn-outline-primary btn-sm">查看详情</span>' +
                        '</div></div></div></div>';
                });
                $('#recommendList').html(html);
            } else {
                $('#recommendList').html('<div class="col text-center text-muted py-5">暂无推荐书籍</div>');
            }
        }).fail(function () {
            $('#recommendList').html('<div class="col text-center text-muted py-5">暂无推荐书籍</div>');
        });
    }

    function goDetail(bookId) {
        window.location.href = 'book-detail.html?id=' + bookId;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>

</body>
</html>
