<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品浏览 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .search-card {
            padding: 25px;
            margin-bottom: 25px;
        }
        .book-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .book-card .cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
            background: #eee;
        }
        .book-card .card-body { padding: 16px; }
        .book-card .card-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .book-card .info { font-size: 12px; color: #999; margin-top: 6px; }
        .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link active" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <!-- 搜索区域 -->
            <div class="search-card card rounded shadow-sm">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label">书名关键词</label>
                        <input type="text" class="form-control" id="keyword" placeholder="输入书名关键字">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">所属课程</label>
                        <select class="form-select" id="courseId">
                            <option value="">全部课程</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">最低价</label>
                        <input type="number" class="form-control" id="minPrice" placeholder="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">最高价</label>
                        <input type="number" class="form-control" id="maxPrice" placeholder="不限">
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button class="btn btn-primary flex-fill" onclick="search(1)"><i class="bi bi-search"></i> 搜索</button>
                        <button class="btn btn-outline-secondary" onclick="resetSearch()">重置</button>
                    </div>
                </div>
            </div>

            <!-- 搜索结果 -->
            <div id="resultArea">
                <div class="text-center text-muted py-5">请输入条件后点击搜索</div>
            </div>

            <!-- 分页 -->
            <nav id="paginationArea" class="mt-3" style="display:none;">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
    var currentPage = 1;
    var pageSize = 12;

    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        $('#displayUsername').text(username);
        loadCourses();
    });

    function loadCourses() {
        $.get('/course/list', function (res) {
            if (res.code === 200 && res.data) {
                var html = '<option value="">全部课程</option>';
                $.each(res.data, function (i, c) {
                    html += '<option value="' + c.courseId + '">' + c.courseName + '</option>';
                });
                $('#courseId').html(html);
            }
        }).fail(function () {
            var fallback = [
                { courseId: 1, courseName: '数据结构与算法' },
                { courseId: 2, courseName: '操作系统' },
                { courseId: 3, courseName: '计算机网络' },
                { courseId: 4, courseName: '数据库系统原理' },
                { courseId: 5, courseName: '软件工程' }
            ];
            var html = '<option value="">全部课程</option>';
            $.each(fallback, function (i, c) {
                html += '<option value="' + c.courseId + '">' + c.courseName + '</option>';
            });
            $('#courseId').html(html);
        });
    }

    function search(page) {
        currentPage = page || 1;
        var params = {
            keyword: $('#keyword').val().trim(),
            courseId: $('#courseId').val(),
            minPrice: $('#minPrice').val(),
            maxPrice: $('#maxPrice').val(),
            status: '在售',
            pageNum: currentPage,
            pageSize: pageSize
        };

        $('#resultArea').html('<div class="text-center text-muted py-5"><div class="spinner-border text-primary mb-2"></div><div>正在加载...</div></div>');
        $('#paginationArea').hide();

        $.get('/book/search', params, function (res) {
            if (res.code === 200 && res.data) {
                renderBooks(res.data.list);
                renderPagination(res.data.total);
            } else {
                $('#resultArea').html('<div class="text-center text-muted py-5">暂无数据</div>');
            }
        }).fail(function () {
            $('#resultArea').html('<div class="text-center text-danger py-5">加载失败，请稍后重试</div>');
        });
    }

    function renderBooks(list) {
        if (!list || list.length === 0) {
            $('#resultArea').html('<div class="text-center text-muted py-5">未找到符合条件的书籍</div>');
            return;
        }
        var html = '<div class="row">';
        $.each(list, function (i, book) {
            var cover = book.coverImgPath || 'https://via.placeholder.com/300x180?text=暂无封面';
            var statusClass = book.status === '在售' ? 'bg-success' : (book.status === '已预定' ? 'bg-warning text-dark' : 'bg-secondary');
            html += '<div class="col-xl-3 col-md-4 col-sm-6 mb-4">' +
                '<div class="card book-card h-100 card-hover rounded" onclick="viewDetail(' + book.bookId + ')">' +
                '<img class="cover" src="' + cover + '" alt="' + book.title + '">' +
                '<div class="card-body d-flex flex-column">' +
                '<h5 class="card-title">' + book.title + '</h5>' +
                '<div class="info">成色：' + (book.conditionDesc || '未填写') + '</div>' +
                '<div class="info">卖家：' + (book.sellerName || ('用户#' + book.sellerId)) + ' <span class="badge bg-info text-dark">' + (book.creditScore || '5.00') + '⭐</span></div>' +
                '<div class="mt-auto d-flex justify-content-between align-items-center">' +
                '<span class="price">¥' + book.sellingPrice + '</span>' +
                '<span class="status-badge ' + statusClass + '">' + book.status + '</span>' +
                '</div></div></div></div>';
        });
        html += '</div>';
        $('#resultArea').html(html);
    }

    function renderPagination(total) {
        var totalPages = Math.ceil(total / pageSize);
        if (totalPages <= 1) { $('#paginationArea').hide(); return; }

        var html = '<li class="page-item' + (currentPage <= 1 ? ' disabled' : '') + '">' +
            '<a class="page-link" href="javascript:void(0)" onclick="search(' + (currentPage - 1) + ')">上一页</a></li>';

        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);
        for (var i = start; i <= end; i++) {
            html += '<li class="page-item' + (i === currentPage ? ' active' : '') + '">' +
                '<a class="page-link" href="javascript:void(0)" onclick="search(' + i + ')">' + i + '</a></li>';
        }

        html += '<li class="page-item' + (currentPage >= totalPages ? ' disabled' : '') + '">' +
            '<a class="page-link" href="javascript:void(0)" onclick="search(' + (currentPage + 1) + ')">下一页</a></li>';

        html += '<li class="page-item disabled"><span class="page-text">共 ' + total + ' 本</span></li>';

        $('#pagination').html(html);
        $('#paginationArea').show();
    }

    function resetSearch() {
        $('#keyword').val('');
        $('#courseId').val('');
        $('#minPrice').val('');
        $('#maxPrice').val('');
        search(1);
    }

    function viewDetail(bookId) {
        window.location.href = 'book-detail.html?id=' + bookId;
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>

</body>
</html>
