<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评价订单 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        .eval-card { max-width: 620px; }
        .eval-card h4 { font-weight: 700; margin-bottom: 20px; }
        .order-info { background: #f8f9fc; border-radius: 8px; padding: 16px 20px; }
        .order-info .row { font-size: 14px; margin-bottom: 6px; }
        .order-info .label { color: #999; }
        .order-info .value { font-weight: 600; color: #333; }
        .star-wrap { font-size: 40px; cursor: pointer; color: #ddd; }
        .star-wrap .bi-star-fill { color: #f6b93b; }
        .star-text { color: #666; font-size: 14px; margin-top: 6px; }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 校园二手书交易平台</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
                <i class="bi bi-person-circle"></i>
                <span id="displayUsername">用户</span>
            </span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i>首页</a>
                <a class="nav-link" href="book-list.html"><i class="bi bi-book"></i>商品浏览</a>
                <a class="nav-link" href="publish.html"><i class="bi bi-plus-circle"></i>发布商品</a>
                <a class="nav-link active" href="orders.html"><i class="bi bi-receipt"></i>我的订单</a>
                <a class="nav-link" href="message.html"><i class="bi bi-chat-dots"></i>我的留言</a>
                <a class="nav-link" href="#"><i class="bi bi-heart"></i>我的收藏</a>
                <a class="nav-link" href="#"><i class="bi bi-lightbulb"></i>推荐书架</a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="col-md-10 main-content p-4">
            <div class="eval-card card rounded shadow-sm px-4 py-4">
                <h4><i class="bi bi-star text-warning"></i> 评价订单</h4>

                <!-- 订单信息 -->
                <div class="order-info mb-4" id="orderInfo" style="display:none;">
                    <div class="row">
                        <div class="col-4 label">订单号</div>
                        <div class="col-8 value" id="orderIdShow"></div>
                    </div>
                    <div class="row">
                        <div class="col-4 label">书籍名称</div>
                        <div class="col-8 value" id="bookTitle"></div>
                    </div>
                    <div class="row">
                        <div class="col-4 label">卖家</div>
                        <div class="col-8 value" id="sellerName"></div>
                    </div>
                    <div class="row">
                        <div class="col-4 label">成交价</div>
                        <div class="col-8 value" id="totalAmount"></div>
                    </div>
                    <div class="row" style="margin-bottom:0;">
                        <div class="col-4 label">订单状态</div>
                        <div class="col-8 value" id="orderStatus"></div>
                    </div>
                </div>

                <!-- 评分组件 -->
                <label class="form-label">评分</label>
                <div class="star-wrap mb-2" id="starWrap">
                    <i class="bi bi-star" data-score="1"></i>
                    <i class="bi bi-star" data-score="2"></i>
                    <i class="bi bi-star" data-score="3"></i>
                    <i class="bi bi-star" data-score="4"></i>
                    <i class="bi bi-star" data-score="5"></i>
                </div>
                <div class="star-text" id="starText">请点击星星评分（必填）</div>

                <!-- 评语 -->
                <div class="mt-4">
                    <label class="form-label">评语</label>
                    <textarea class="form-control" id="comment" rows="4" placeholder="说说你的交易体验（选填）"></textarea>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary px-4" id="submitBtn" onclick="submitEval()">
                        <i class="bi bi-check-circle"></i> 提交评价
                    </button>
                    <a href="orders.html" class="btn btn-outline-secondary">返回订单</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var orderId = '';
    var evaluatorId = '';
    var score = 0;
    var STARS = ['1', '2', '3', '4', '5'];

    $(function () {
        var username = sessionStorage.getItem('username') || '用户';
        evaluatorId = sessionStorage.getItem('userId') || '1';
        $('#displayUsername').text(username);

        var urlParams = new URLSearchParams(window.location.search);
        orderId = urlParams.get('orderId');
        if (!orderId) {
            showToast('缺少订单号', '提示');
            window.location.href = 'orders.html';
            return;
        }
        loadOrderInfo();
    });

    function loadOrderInfo() {
        $('#orderInfo').show();
        $('#orderIdShow').text(orderId);
        $.get('/order/detail', { orderId: orderId }, function (res) {
            if (res.code === 200 && res.data) {
                var d = res.data;
                $('#bookTitle').text(d.bookTitle || '—');
                $('#sellerName').text(d.sellerName || '—');
                $('#totalAmount').text('¥' + (d.totalAmount || '0'));

                var statusText = d.status === '已完成' ? '<span class="text-success">已完成</span>' : '<span class="text-danger">' + (d.status || '') + '</span>';
                $('#orderStatus').html(statusText);

                if (d.status !== '已完成') {
                    showToast('当前订单不是"已完成"状态，无法评价', '提示');
                    $('#submitBtn').prop('disabled', true);
                }
            } else {
                showToast(res.message || '加载订单失败', '提示');
            }
        }).fail(function () {
            showToast('加载订单失败，请稍后重试', '提示');
        });
    }

    // 星星点击选择
    $('#starWrap .bi').on('click', function () {
        score = parseInt($(this).data('score'));
        highlightStars(score);
    });

    function highlightStars(n) {
        $('#starWrap .bi').each(function () {
            var s = parseInt($(this).data('score'));
            if (s <= n) {
                $(this).removeClass('bi-star').addClass('bi-star-fill');
            } else {
                $(this).removeClass('bi-star-fill').addClass('bi-star');
            }
        });
        var texts = { 1: '很差', 2: '较差', 3: '一般', 4: '满意', 5: '非常满意' };
        $('#starText').text(texts[n] + '（' + n + '星）');
    }

    function submitEval() {
        if (score === 0) { showToast('请先进行评分', '提示'); return; }
        var comment = $('#comment').val().trim();

        $('#submitBtn').prop('disabled', true).text('提交中...');

        $.post('/evaluation/submit', {
            orderId: orderId,
            evaluatorId: evaluatorId,
            score: score,
            comment: comment
        }, function (res) {
            if (res.code === 200) {
                showToast('评价成功', '成功');
                window.location.href = 'orders.html';
            } else {
                showToast(res.message || '评价失败', '提示');
                $('#submitBtn').prop('disabled', false).text('提交评价');
            }
        }).fail(function () {
            showToast('评价失败，请稍后重试', '提示');
            $('#submitBtn').prop('disabled', false).text('提交评价');
        });
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
