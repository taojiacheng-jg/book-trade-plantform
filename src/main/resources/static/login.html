<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 图书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="font-size:56px;">📚</div>
            <h2 class="mb-2">图书交易平台</h2>
            <p class="text-muted" style="font-size:14px;">校园二手书 · 管理员与用户通用入口</p>
        </div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">登 录</button>
            </div>
        </form>
        <div class="text-center mt-3" style="font-size:14px;">
            还没有账号？<a href="register.html" class="text-decoration-none">去注册</a>
        </div>
    </div>

    <!-- 自定义提示弹窗 -->
    <div class="modal fade" id="msgModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-brand">
                <div class="modal-header">
                    <h5 class="modal-title" id="msgTitle">提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body" id="msgText"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">知道了</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showMsg(text, title) {
            document.getElementById('msgText').textContent = text;
            if (title) document.getElementById('msgTitle').textContent = title;
            new bootstrap.Modal(document.getElementById('msgModal')).show();
        }

        function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showMsg('请输入用户名和密码', '提示');
                return false;
            }

            fetch('/user/login?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password))
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.code === 200) {
                        var user = res.data;
                        sessionStorage.setItem('userId', user.userId);
                        sessionStorage.setItem('username', user.username);
                        sessionStorage.setItem('role', user.role);

                        if (user.role === 'ADMIN') {
                            window.location.href = 'admin/index.html';
                        } else if (user.role === 'USER') {
                            window.location.href = 'user/index.html';
                        } else {
                            showMsg('未知角色，无法跳转', '提示');
                        }
                    } else if (res.code === 501) {
                        showMsg('用户名错误', '登录失败');
                    } else if (res.code === 502) {
                        showMsg('密码错误', '登录失败');
                    } else {
                        showMsg(res.message || '登录失败', '登录失败');
                    }
                })
                .catch(function() {
                    showMsg('网络异常，请稍后重试', '提示');
                });

            return false;
        }
    </script>
</body>
</html>
