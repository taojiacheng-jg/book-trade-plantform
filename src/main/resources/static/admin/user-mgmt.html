<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 校园二手书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">📚 后台管理</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3"><i class="bi bi-person-circle"></i> <span id="displayUsername">管理员</span></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">退出</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html"><i class="bi bi-speedometer2"></i>后台首页</a>
                <a class="nav-link active" href="#"><i class="bi bi-people"></i>用户管理</a>
                <a class="nav-link" href="book-mgmt.html"><i class="bi bi-shield-exclamation"></i>商品监管</a>
                <a class="nav-link" href="statistics.html"><i class="bi bi-bar-chart"></i>数据统计</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold"><i class="bi bi-people text-primary"></i> 用户管理</h4>
                <button class="btn btn-outline-primary btn-sm" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i> 刷新</button>
            </div>

            <div class="card rounded shadow-sm p-3">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead><tr>
                            <th>ID</th><th>用户名</th><th>邮箱</th><th>手机号</th><th>信用分</th><th>状态</th><th class="text-end">操作</th>
                        </tr></thead>
                        <tbody id="userList">
                            <tr><td colspan="7" class="text-center text-muted py-4">正在加载...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        $('#displayUsername').text(sessionStorage.getItem('username') || '管理员');
        loadUsers();
    });

    function loadUsers() {
        $('#userList').html('<tr><td colspan="7" class="text-center text-muted py-4">正在加载...</td></tr>');
        $.get('/admin/users', function (res) {
            if (res.code === 200 && res.data) {
                var html = '';
                $.each(res.data, function (i, u) {
                    var roleBadge = u.role === 'ADMIN' ? 'bg-warning text-dark' : 'bg-info text-dark';
                    var statusBadge = u.status === 'banned' ? 'bg-danger' : 'bg-success';
                    var statusText = u.status === 'banned' ? 'banned' : 'normal';
                    var action = '';

                    if (u.role === 'ADMIN') {
                        action = '<span class="text-muted small">内置管理员</span>';
                    } else if (u.status === 'banned') {
                        action = '<button class="btn btn-outline-success btn-sm" onclick="unban(' + u.userId + ')"><i class="bi bi-unlock"></i> 解封</button>';
                    } else {
                        action = '<button class="btn btn-outline-danger btn-sm" onclick="ban(' + u.userId + ')"><i class="bi bi-lock"></i> 封禁</button>';
                    }

                    html += '<tr>' +
                        '<td>' + u.userId + '</td>' +
                        '<td><i class="bi bi-person"></i> ' + escapeHtml(u.username) +
                        '<span class="badge ' + roleBadge + ' ms-2">' + u.role + '</span></td>' +
                        '<td>' + escapeHtml(u.email || '—') + '</td>' +
                        '<td>' + escapeHtml(u.phone || '—') + '</td>' +
                        '<td>' + u.creditScore + ' ⭐</td>' +
                        '<td><span class="badge ' + statusBadge + '">' + statusText + '</span></td>' +
                        '<td class="text-end">' + action + '</td>' +
                        '</tr>';
                });
                $('#userList').html(html);
            } else {
                $('#userList').html('<tr><td colspan="7" class="text-center text-danger py-4">' + (res.message || '加载失败') + '</td></tr>');
            }
        }).fail(function () {
            $('#userList').html('<tr><td colspan="7" class="text-center text-danger py-4">加载失败，请稍后重试</td></tr>');
        });
    }

    function ban(userId) {
        confirmDialog('确定封禁该用户吗？封禁后其所有在售书籍将被下架。', '封禁确认').then(function (ok) {
            if (!ok) return;
            $.post('/admin/ban', { userId: userId }, function (res) {
                if (res.code === 200) { showToast('已封禁该用户', '成功'); loadUsers(); }
                else { showToast(res.message || '操作失败', '提示'); }
            }).fail(function () { showToast('操作失败，请稍后重试', '提示'); });
        });
    }

    function unban(userId) {
        confirmDialog('确定解封该用户吗？', '解封确认').then(function (ok) {
            if (!ok) return;
            $.post('/admin/unban', { userId: userId }, function (res) {
                if (res.code === 200) { showToast('已解封该用户', '成功'); loadUsers(); }
                else { showToast(res.message || '操作失败', '提示'); }
            }).fail(function () { showToast('操作失败，请稍后重试', '提示'); });
        });
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = '../login.html';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>

</body>
</html>
